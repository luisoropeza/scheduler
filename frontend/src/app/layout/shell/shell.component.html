<div class="relative flex h-screen justify-center overflow-hidden bg-gradient-to-b from-[#eef2f7] via-[#f5f7fa] to-[#eef3f6]">
  <div class="bg-blob -left-28 -top-56 h-[560px] w-[560px] bg-primary/20"></div>
  <div class="bg-blob -right-40 top-16 h-[520px] w-[520px] bg-secondary/[0.22]"></div>
  <div class="bg-blob -bottom-52 left-1/3 h-[460px] w-[460px] bg-tertiary/[0.13]"></div>

  <!-- Capped + centered so the app reads as one native-feeling window instead of stretching edge-to-edge on wide desktops. -->
  <div class="relative z-10 flex h-full w-full max-w-[1680px] min-w-0">
    <app-sidebar-nav [navItems]="navItems" />

    <div class="flex min-w-0 flex-1 flex-col">
      <app-topbar />

      <main class="flex min-h-0 flex-1 flex-col overflow-hidden px-8 pb-8">
        <router-outlet />
      </main>
    </div>
  </div>
</div>
