<app-page-header
  title="Tablero"
  [subtitle]="
    readonly ? 'Vista de solo lectura' : 'Arrastra una cita para confirmarla o cancelarla'
  "
>
  <app-date-range-picker
    titleAccessory
    [from]="dateFrom()"
    [to]="dateTo()"
    (rangeChange)="setDateRange($event)"
  />
  <button
    type="button"
    class="btn btn-secondary"
    (click)="resource.reload()"
    [disabled]="resource.isLoading()"
  >
    <app-ui-icon name="refresh" class="h-4 w-4" [class.animate-spin]="resource.isLoading()" />
    Actualizar
  </button>
</app-page-header>

@if (resource.error()) {
  <div class="mb-4 rounded-2xl bg-red-50 px-4 py-3 text-sm font-medium text-red-700">
    No se pudo cargar el tablero. Intenta actualizar.
  </div>
}

<div
  cdkDropListGroup
  class="flex min-h-0 flex-1 snap-x gap-5 overflow-x-auto pb-4"
  [class.opacity-60]="resource.isLoading()"
>
  @for (column of columns(); track column.id) {
    <app-board-column
      [column]="column"
      [showDates]="showDates()"
      [readonly]="readonly"
      (dropped)="drop($event)"
      (open)="open($event)"
    />
  }
</div>
