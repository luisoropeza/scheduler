<form action="" [formGroup]="form" class="w-full max-w-sm">
  <div class="rounded-2xl border border-gray-100 bg-white p-8 shadow-xl shadow-gray-900/5">
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-gray-900">Inicia Sesión</h1>
      <p class="mt-1 text-sm text-gray-500">Ingresa tus credenciales para acceder a tu cuenta</p>
    </div>

    <div class="space-y-4">
      <app-input-component
        label="Correo electrónico"
        placeholder="tucorreo@clinica.com"
        [type]="inputType.EMAIL"
        [isRequired]="true"
        formControlName="email"
      />
      <app-input-component
        label="Contraseña"
        placeholder="Ingresa tu contraseña"
        [type]="inputType.PASSWORD"
        [isRequired]="true"
        formControlName="password"
      />
    </div>

    <app-button-component appClickLogin label="Ingresar" [fullWidth]="true" class="mt-6" />

    <div class="mt-6 flex items-center gap-3">
      <span class="h-px flex-1 bg-gray-200"></span>
      <span class="text-xs text-gray-400">¿No tienes cuenta?</span>
      <span class="h-px flex-1 bg-gray-200"></span>
    </div>

    <app-button-component label="Crear cuenta" variant="outlined" [fullWidth]="true" (click)="navigate($event)" class="mt-4" />
  </div>
</form>
