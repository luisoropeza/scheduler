<form [formGroup]="formGroup" (ngSubmit)="submit()" class="w-full max-w-md">
  <div class="rounded-2xl border border-gray-100 bg-white p-8 shadow-xl shadow-gray-900/5">
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-gray-900">Registra tu clínica</h1>
      <p class="mt-1 text-sm text-gray-500">Crea el espacio de tu clínica y la cuenta de su administrador</p>
    </div>

    <p class="mb-3 text-xs font-bold uppercase tracking-wide text-gray-400">Clínica</p>
    <div class="grid gap-4 sm:grid-cols-2">
      <app-input-component
        label="Nombre"
        placeholder="Clínica Central"
        [type]="inputType.TEXT"
        [isRequired]="true"
        formControlName="name"
      />
      <app-input-component
        label="Teléfono"
        placeholder="+591 700 00000"
        [type]="inputType.TEXT"
        [isRequired]="true"
        formControlName="phoneNumber"
      />
    </div>

    <p class="mb-3 mt-6 text-xs font-bold uppercase tracking-wide text-gray-400">Administrador</p>
    <div class="space-y-4">
      <div class="grid gap-4 sm:grid-cols-2">
        <app-input-component
          label="Nombre completo"
          placeholder="Tu nombre"
          [type]="inputType.TEXT"
          [isRequired]="true"
          formControlName="adminName"
        />
        <app-input-component
          label="CI"
          placeholder="Documento de identidad"
          [type]="inputType.TEXT"
          [isRequired]="true"
          formControlName="adminCi"
        />
      </div>
      <app-input-component
        label="Email"
        placeholder="admin@tuclinica.com"
        [type]="inputType.EMAIL"
        [isRequired]="true"
        formControlName="adminEmail"
      />
      <app-input-component
        label="Contraseña"
        placeholder="Mínimo 8 caracteres"
        [type]="inputType.PASSWORD"
        [isRequired]="true"
        formControlName="adminPassword"
      />
    </div>

    <app-button-component type="submit" label="Registrar clínica" [fullWidth]="true" [loading]="submitting()" class="mt-6" />

    <div class="mt-6 flex items-center gap-3">
      <span class="h-px flex-1 bg-gray-200"></span>
      <span class="text-xs text-gray-400">¿Ya tienes cuenta?</span>
      <span class="h-px flex-1 bg-gray-200"></span>
    </div>

    <a
      routerLink="/clinic-options"
      class="mt-4 flex w-full items-center justify-center rounded-lg border border-gray-300 px-4 py-2.5 text-sm font-semibold text-gray-700 transition-colors hover:bg-gray-50"
    >
      Iniciar sesión
    </a>
  </div>
</form>
