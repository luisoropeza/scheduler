<app-dialog-frame
  title="Agregar horario"
  subtitle="Bloque semanal en el que atiendes"
  (closed)="close()"
>
  <form id="availability-form" [formGroup]="form" (ngSubmit)="save()" class="space-y-5">
    <div>
      <p class="field-label">Días</p>
      <div class="flex flex-wrap gap-1.5">
        @for (day of days; track day.value) {
          <button
            type="button"
            class="chip cursor-pointer px-3 py-1.5 text-sm transition-colors"
            [class]="
              selectedDays().has(day.value)
                ? 'bg-primary text-white'
                : 'bg-white/60 text-gray-600 hover:bg-white'
            "
            [attr.aria-pressed]="selectedDays().has(day.value)"
            (click)="toggleDay(day.value)"
          >
            {{ day.short }}
          </button>
        }
      </div>
      @if (!selectedDays().size) {
        <p class="field-error">Selecciona al menos un día</p>
      }
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="field-label" for="av-start">Desde</label>
        <app-time-picker id="av-start" formControlName="startTime" />
      </div>
      <div>
        <label class="field-label" for="av-end">Hasta</label>
        <app-time-picker id="av-end" formControlName="endTime" [min]="endMin()" />
      </div>
    </div>
    @if (form.hasError('endBeforeStart')) {
      <p class="field-error -mt-3">La hora de fin debe ser posterior a la de inicio</p>
    }

    <div>
      <label class="field-label" for="av-duration">Duración de cada cita</label>
      <app-select
        id="av-duration"
        formControlName="slotDurationMinutes"
        [options]="durationOptions"
      />
    </div>

    @if (error(); as message) {
      <p class="rounded-2xl bg-red-50 px-4 py-3 text-sm font-medium text-red-700">{{ message }}</p>
    }
  </form>

  <div dialogFooter class="contents">
    <button type="button" class="btn btn-secondary" (click)="close()">Cancelar</button>
    <button type="submit" form="availability-form" class="btn btn-primary" [disabled]="saving()">
      {{ saving() ? 'Guardando…' : 'Agregar' }}
    </button>
  </div>
</app-dialog-frame>
