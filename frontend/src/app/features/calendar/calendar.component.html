<app-page-header [title]="monthLabel()">
  <app-calendar-nav (previous)="previousMonth()" (next)="nextMonth()" (today)="goToday()" />
</app-page-header>

<div class="flex min-h-0 flex-1 flex-col gap-5 overflow-y-auto xl:flex-row xl:overflow-visible">
  <div
    class="glass-panel flex min-h-0 flex-col rounded-3xl p-3 sm:p-6 xl:flex-[2.1]"
    [class.opacity-70]="resource.isLoading()"
  >
    <div
      class="mb-2 grid shrink-0 grid-cols-7 gap-2 text-center text-[12.5px] font-bold tracking-wide text-gray-500"
    >
      @for (label of weekdayLabels; track label) {
        <span>{{ label }}</span>
      }
    </div>

    <div
      class="-m-2 grid min-h-0 flex-1 grid-cols-7 grid-rows-6 gap-1 overflow-y-auto p-2 sm:gap-2.5"
    >
      @for (week of weeks(); track $index) {
        @for (day of week; track day.iso) {
          <app-calendar-day-cell
            [day]="day"
            [appointments]="appointmentsFor(day.iso)"
            [selected]="day.iso === selectedDate()"
            (select)="selectDay($event)"
          />
        }
      }
    </div>

    @if (resource.error()) {
      <p class="mt-3 text-sm font-medium text-red-600">No se pudo cargar el calendario.</p>
    }
  </div>

  <app-day-agenda-panel
    [dayLabel]="selectedDayLabel()"
    [appointments]="selectedDayAppointments()"
    [canCreate]="canCreateOnSelected()"
    [doctorAsTitle]="isPatient"
    (newAppointment)="openNewAppointment()"
    (open)="open($event)"
  />
</div>
