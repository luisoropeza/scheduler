<div class="relative w-full max-w-sm">
  <svg class="absolute left-4 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
    <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.3-4.3M19 11a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" />
  </svg>
  <input
    type="text"
    [placeholder]="searchPlaceholder()"
    class="w-full rounded-2xl bg-white/40 py-2.5 pl-10 pr-3 text-sm text-gray-700 placeholder:text-gray-400 transition-colors focus:bg-white/70 focus:outline-none"
  />
</div>

<div class="glass-panel flex shrink-0 items-center gap-1.5 rounded-2xl p-1.5">
  <button
    type="button"
    (click)="notificationsClick.emit()"
    class="flex h-10 w-10 items-center justify-center rounded-xl text-gray-500 transition-colors hover:bg-white/60"
    aria-label="Notifications"
  >
    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3a4 4 0 0 0-4 4v3.3c0 .5-.2 1-.5 1.4L6 14h12l-1.5-2.3a2.3 2.3 0 0 1-.5-1.4V7a4 4 0 0 0-4-4ZM10 17a2 2 0 0 0 4 0" />
    </svg>
  </button>
  <div class="h-10 w-10 rounded-full bg-primary text-center text-sm font-bold leading-10 text-white">{{ avatarInitial() }}</div>
</div>
