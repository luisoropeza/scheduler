<div class="min-w-0">
  <p class="truncate text-lg font-bold text-gray-900">{{ greeting() }}, {{ firstName() }}</p>
  <p class="text-sm font-medium text-gray-500">{{ today }}</p>
</div>

<a
  routerLink="/profile"
  class="glass-panel flex shrink-0 items-center gap-3 rounded-2xl py-1.5 pl-1.5 pr-4 transition-colors hover:bg-white/70"
>
  <div class="h-10 w-10 rounded-xl bg-primary text-center text-sm font-bold leading-10 text-white">{{ avatarInitials() }}</div>
  <div class="hidden text-left sm:block">
    <p class="text-sm font-bold leading-tight text-gray-900">{{ userName() }}</p>
    <p class="text-xs font-medium text-gray-500">{{ roleLabel() }}</p>
  </div>
</a>
