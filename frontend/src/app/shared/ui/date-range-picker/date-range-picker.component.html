<button
  type="button"
  (click)="toggle()"
  class="group inline-flex items-center gap-1.5 rounded-xl bg-gray-900/[0.05] py-1 pl-2.5 pr-2 text-[15px] font-bold text-gray-600 transition-colors hover:bg-gray-900/[0.08] hover:text-gray-900"
>
  <svg class="h-4 w-4 text-gray-500 transition-colors group-hover:text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
    <path stroke-linecap="round" stroke-linejoin="round" d="M8 2v4M16 2v4M3.5 9h17M4 4.5h16A1.5 1.5 0 0 1 21.5 6v14A1.5 1.5 0 0 1 20 21.5H4A1.5 1.5 0 0 1 2.5 20V6A1.5 1.5 0 0 1 4 4.5Z" />
  </svg>
  {{ label() }}
  <svg class="h-3.5 w-3.5 text-gray-500 transition-transform {{ isOpen() ? 'rotate-180' : '' }}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
    <path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6" />
  </svg>
</button>

@if (isOpen()) {
  <div class="fixed inset-0 z-40" (click)="close()"></div>

  <div class="glass-modal absolute left-0 z-50 mt-2 w-[19rem] rounded-3xl p-4">
    <div class="mb-3 flex items-center justify-between">
      <button
        type="button"
        (click)="previousMonth()"
        class="flex h-8 w-8 items-center justify-center rounded-xl text-gray-600 transition-colors hover:bg-white/60"
        aria-label="Previous month"
      >
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6" />
        </svg>
      </button>
      <p class="text-sm font-extrabold text-gray-900">{{ monthLabel() }}</p>
      <button
        type="button"
        (click)="nextMonth()"
        class="flex h-8 w-8 items-center justify-center rounded-xl text-gray-600 transition-colors hover:bg-white/60"
        aria-label="Next month"
      >
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6" />
        </svg>
      </button>
    </div>

    <div class="mb-1.5 grid grid-cols-7 text-center text-[11px] font-bold tracking-wide text-gray-400">
      @for (weekday of weekdayLabels; track $index) {
        <span>{{ weekday }}</span>
      }
    </div>

    <div class="grid grid-cols-7 gap-y-1" (mouseleave)="clearHover()">
      @for (week of weeks(); track $index) {
        @for (day of week; track day.iso) {
          @let state = dayState(day);
          <button
            type="button"
            (click)="pick(day.iso)"
            (mouseenter)="hover(day.iso)"
            class="mx-auto flex h-9 w-9 items-center justify-center rounded-full text-[13px] font-semibold transition-colors {{
              state.isStart || state.isEnd
                ? 'bg-primary font-bold text-white'
                : state.inRange
                  ? 'bg-primary/15 font-bold text-primary'
                  : state.isToday
                    ? 'font-extrabold text-primary'
                    : day.inCurrentMonth
                      ? 'text-gray-700 hover:bg-white/70'
                      : 'text-gray-300 hover:bg-white/40'
            }}"
          >
            {{ day.date.getDate() }}
          </button>
        }
      }
    </div>

    <div class="mt-3.5 flex flex-wrap gap-1.5 border-t border-white/60 pt-3.5">
      <button
        type="button"
        (click)="presetToday()"
        class="glass-panel rounded-xl px-3 py-1.5 text-xs font-bold text-gray-700 transition-colors hover:bg-white/70"
      >
        Today
      </button>
      <button
        type="button"
        (click)="presetNext7Days()"
        class="glass-panel rounded-xl px-3 py-1.5 text-xs font-bold text-gray-700 transition-colors hover:bg-white/70"
      >
        Next 7 days
      </button>
      <button
        type="button"
        (click)="presetThisMonth()"
        class="glass-panel rounded-xl px-3 py-1.5 text-xs font-bold text-gray-700 transition-colors hover:bg-white/70"
      >
        This month
      </button>
    </div>
  </div>
}
