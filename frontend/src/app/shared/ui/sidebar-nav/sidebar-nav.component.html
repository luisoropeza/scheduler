<div class="flex items-center gap-3 px-5 py-6">
  <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-primary text-base font-bold text-white shadow-lg shadow-primary/30">CC</div>
  <div>
    <p class="text-base font-bold text-gray-900">Central Clinic</p>
    <p class="text-sm text-gray-500">Oncology Dept</p>
  </div>
</div>

<nav class="flex-1 space-y-1.5 px-4 py-2">
  @for (item of navItems(); track item.route) {
    <a
      [routerLink]="item.route"
      routerLinkActive="bg-white/90 text-primary shadow-md"
      class="flex items-center gap-3 rounded-2xl px-4 py-3 text-[15px] font-semibold text-gray-500 transition-colors hover:bg-white/60"
    >
      <svg class="h-[18px] w-[18px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        @switch (item.icon) {
          @case ('board') {
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 3v18M4 3h16a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" />
          }
          @case ('calendar') {
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 2v4M16 2v4M3.5 9h17M4 4.5h16A1.5 1.5 0 0 1 21.5 6v14A1.5 1.5 0 0 1 20 21.5H4A1.5 1.5 0 0 1 2.5 20V6A1.5 1.5 0 0 1 4 4.5Z" />
          }
          @case ('patients') {
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 5 18.5V20M11.5 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM19 20v-1.5a3 3 0 0 0-2.2-2.9M15.5 4.6a3 3 0 0 1 0 5.8" />
          }
          @case ('analytics') {
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 20V10M11 20V4M18 20v-6" />
          }
        }
      </svg>
      {{ item.label }}
    </a>
  }
</nav>

<div class="space-y-1 px-3 py-3">
  <a href="#" class="flex items-center gap-3 rounded-2xl px-4 py-2.5 text-[15px] font-semibold text-gray-500 transition-colors hover:bg-white/60">
    <svg class="h-[18px] w-[18px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18ZM9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2 1.7-2 3.2M12 16.5h.01" />
    </svg>
    Support
  </a>
  <a href="#" class="flex items-center gap-3 rounded-2xl px-4 py-2.5 text-[15px] font-semibold text-gray-500 transition-colors hover:bg-white/60">
    <svg class="h-[18px] w-[18px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 21H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h4M16 17l5-5-5-5M21 12H9" />
    </svg>
    Logout
  </a>
</div>
