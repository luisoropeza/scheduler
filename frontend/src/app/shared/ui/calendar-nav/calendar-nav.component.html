<button
  type="button"
  (click)="previous.emit()"
  class="glass-panel flex h-11 w-11 items-center justify-center rounded-2xl text-gray-700 transition-colors hover:bg-white/70"
  aria-label="Previous month"
>
  <svg class="h-[18px] w-[18px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
    <path stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6" />
  </svg>
</button>
<button
  type="button"
  (click)="next.emit()"
  class="glass-panel flex h-11 w-11 items-center justify-center rounded-2xl text-gray-700 transition-colors hover:bg-white/70"
  aria-label="Next month"
>
  <svg class="h-[18px] w-[18px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
    <path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6" />
  </svg>
</button>
<button
  type="button"
  (click)="today.emit()"
  class="glass-panel rounded-2xl px-5 py-2.5 text-sm font-bold text-gray-700 transition-colors hover:bg-white/70"
>
  Today
</button>
