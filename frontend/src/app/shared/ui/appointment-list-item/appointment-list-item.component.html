<div class="glass-card rounded-2xl p-4" [class.cursor-pointer]="interactive()">
  <div class="mb-2 flex items-start justify-between gap-2.5">
    <p class="text-[16px] font-bold leading-tight text-gray-900">
      {{ doctorAsTitle() ? appointment().doctorName : appointment().clientName }}
    </p>
    @if (appointment().status; as status) {
      <app-status-badge [status]="status" />
    }
  </div>

  <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-[13px] font-medium text-gray-500">
    <span class="inline-flex items-center gap-1.5">
      <app-ui-icon name="clock" class="h-3.5 w-3.5" />
      {{ timeLabel() }}
    </span>
    @if (!doctorAsTitle()) {
      <span class="inline-flex items-center gap-1.5">
        <app-ui-icon name="stethoscope" class="h-3.5 w-3.5" />
        {{ appointment().doctorName }}
      </span>
    }
  </div>
</div>
