@for (item of items(); track item.id) {
  <button
    type="button"
    (click)="select.emit(item.id)"
    class="whitespace-nowrap rounded-xl px-4 py-2.5 text-sm font-semibold transition-colors {{
      item.id === selectedId() ? 'bg-white/95 text-primary shadow-md' : 'text-gray-500 hover:text-gray-700'
    }}"
  >
    {{ item.label }}
  </button>
}
