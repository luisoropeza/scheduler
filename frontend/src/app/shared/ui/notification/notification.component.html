<div class="fixed top-4 right-4 z-[60] flex flex-col gap-3 w-full max-w-sm">
  @for (notification of notifications(); track notification.id) {
    <div
      class="toast flex items-start gap-3 rounded-xl border bg-white p-4 shadow-lg"
      [class.border-emerald-200]="notification.type === 'success'"
      [class.border-red-200]="notification.type === 'error'"
    >
      <div
        class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full"
        [class.bg-emerald-100]="notification.type === 'success'"
        [class.bg-red-100]="notification.type === 'error'"
      >
        @if (notification.type === 'success') {
          <svg
            class="h-5 w-5 text-emerald-600"
            viewBox="0 0 20 20"
            fill="currentColor"
          >
            <path
              fill-rule="evenodd"
              d="M16.704 4.153a.75.75 0 01.143 1.052l-8 10.5a.75.75 0 01-1.127.075l-4.5-4.5a.75.75 0 011.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 011.05-.143z"
              clip-rule="evenodd"
            />
          </svg>
        } @else {
          <svg class="h-5 w-5 text-red-600" viewBox="0 0 20 20" fill="currentColor">
            <path
              fill-rule="evenodd"
              d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z"
              clip-rule="evenodd"
            />
          </svg>
        }
      </div>

      <p class="flex-1 pt-1 text-sm text-neutral-700">{{ notification.message }}</p>

      <button
        type="button"
        (click)="dismiss(notification.id)"
        class="shrink-0 cursor-pointer text-neutral-400 hover:text-neutral-600"
      >
        <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
          <path
            d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z"
          />
        </svg>
      </button>
    </div>
  }
</div>
