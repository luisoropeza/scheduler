<button
  type="button"
  (click)="select.emit(day().iso)"
  class="flex h-24 w-full flex-col items-center justify-center gap-1.5 rounded-2xl text-center transition-all {{
    selected()
      ? 'bg-white/90 shadow-[0_0_0_2px_var(--color-primary),0_10px_24px_-8px_rgb(0,86,179,0.3)]'
      : 'bg-white/25 hover:-translate-y-px hover:bg-white/55'
  }}"
>
  <span
    class="text-[15.5px] {{
      selected()
        ? 'font-extrabold text-primary'
        : day().iso === today
          ? 'font-bold text-primary'
          : day().inCurrentMonth
            ? 'font-semibold text-gray-700'
            : 'font-semibold text-gray-300'
    }}"
  >
    {{ day().date.getDate() }}
  </span>

  <div class="flex h-1.5 items-center gap-1">
    @if (appointments().length) {
      @for (tone of dotTones(); track tone) {
        <span class="h-[5px] w-[5px] rounded-full {{ tone }}"></span>
      }
    }
  </div>
</button>
