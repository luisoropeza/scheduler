<div class="mb-5 flex shrink-0 items-start justify-between gap-3">
  <div>
    <h2 class="text-xl font-extrabold text-gray-900">{{ dayLabel() }}</h2>
    <p class="text-sm font-medium text-gray-500">{{ appointments().length }} Appointments Scheduled</p>
  </div>
  <button
    type="button"
    (click)="newAppointment.emit()"
    class="flex shrink-0 items-center gap-1.5 rounded-2xl bg-primary px-4 py-2.5 text-sm font-bold text-white shadow-lg shadow-primary/30 hover:bg-primary/90"
  >
    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14M5 12h14" />
    </svg>
    New Appt
  </button>
</div>

<div class="-m-2 flex min-h-0 flex-1 flex-col gap-3 overflow-y-auto p-2 pt-3.5">
  @for (appointment of appointments(); track appointment.id) {
    <app-appointment-list-item [appointment]="appointment" />
  } @empty {
    <div class="flex flex-1 items-center justify-center rounded-2xl border-2 border-dashed border-gray-900/10 py-8 text-sm font-medium text-gray-400">
      No appointments for this day
    </div>
  }
</div>
