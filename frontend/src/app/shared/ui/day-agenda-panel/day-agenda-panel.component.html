<div class="mb-5 flex shrink-0 items-start justify-between gap-3">
  <div>
    <h2 class="text-xl font-extrabold text-gray-900">{{ dayLabel() }}</h2>
    <p class="text-sm font-medium text-gray-500">
      {{ appointments().length }} {{ appointments().length === 1 ? 'cita' : 'citas' }}
    </p>
  </div>
  @if (canCreate()) {
    <button type="button" (click)="newAppointment.emit()" class="btn btn-primary shrink-0">
      <app-ui-icon name="plus" class="h-4 w-4" [strokeWidth]="2.4" />
      Agendar cita
    </button>
  }
</div>

<div class="-m-2 flex min-h-0 flex-1 flex-col gap-3 overflow-y-auto p-2 pt-3.5">
  @for (appointment of appointments(); track appointment.id ?? $index) {
    <app-appointment-list-item
      [appointment]="appointment"
      [doctorAsTitle]="doctorAsTitle()"
      (click)="open.emit(appointment)"
    />
  } @empty {
    <div
      class="flex flex-1 items-center justify-center rounded-2xl border-2 border-dashed border-gray-900/10 py-8 text-sm font-medium text-gray-500"
    >
      Sin citas este día
    </div>
  }
</div>
