<div>
  <label [ngClass]="{ required: isRequired() }" for="input" class="mb-1.5 block text-sm font-medium text-gray-700">{{
    label()
  }}</label>
  <input
    [type]="type()"
    class="w-full rounded-lg border px-3 py-2.5 text-sm text-gray-900 placeholder:text-gray-400 transition-colors focus:outline-none focus:ring-2"
    [ngClass]="
      errorMessage ? 'border-red-400 focus:border-red-400 focus:ring-red-100' : 'border-gray-300 focus:border-primary focus:ring-primary/15'
    "
    [placeholder]="placeholder()"
    [formControl]="control"
  />
  @if (errorMessage) {
    <p class="mt-1.5 text-xs text-red-500">{{ errorMessage }}</p>
  }
</div>
