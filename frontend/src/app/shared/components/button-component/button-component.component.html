<button
  type="button"
  class="inline-flex cursor-pointer items-center justify-center gap-2 rounded-lg px-4 py-2.5 text-sm font-semibold transition-colors {{ fullWidth() ? 'w-full' : '' }} {{
    variant() === 'primary'
      ? 'bg-primary text-white hover:bg-primary/90'
      : 'border border-gray-300 text-gray-700 hover:bg-gray-50'
  }}"
>
  {{ label() }}
  <ng-content />
</button>
