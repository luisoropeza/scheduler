<button
  [type]="type()"
  [disabled]="disabled() || loading()"
  class="inline-flex cursor-pointer items-center justify-center gap-2 rounded-lg px-4 py-2.5 text-sm font-semibold transition-colors disabled:cursor-not-allowed disabled:opacity-60 {{
    fullWidth() ? 'w-full' : ''
  }} {{ variant() === 'primary' ? 'bg-primary text-white hover:bg-primary/90' : 'border border-gray-300 text-gray-700 hover:bg-gray-50' }}"
>
  @if (loading()) {
    <span class="h-4 w-4 animate-spin rounded-full border-2 border-current border-t-transparent"></span>
  }
  {{ label() }}
  <ng-content />
</button>
