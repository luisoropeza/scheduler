services:
  - type: web
    name: scheduler-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      # PORT lo inyecta Render (10000); Spring lo lee vía server.port
      - key: DB_URL          # jdbc:postgresql://host:5432/db
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET      # Render genera un valor aleatorio de 256 bits
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS  # el front usa proxy (mismo origen); pon aquí la URL del front si llamas al back directo
        value: "*"
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: scheduler-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: BACKEND_HOST    # host:puerto privado del backend
        fromService:
          type: web
          name: scheduler-backend
          property: hostport
