spring:
  application:
    name: scheduler
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        multiTenancy: SCHEMA
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: gemini-3.5-flash-lite

twilio:
  account-sid: "TU_ACCOUNT_SID"
  auth-token: "TU_AUTH_TOKEN"
  whatsapp-number: "whatsapp:+14155238886"

logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE

server:
  port: ${PORT}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

jwt:
  secret: ${JWT_SECRET}

security:
  public-paths: /api/auth/login, /api/clinics, /swagger-ui/**, /v3/api-docs/**

app:
  mail:
    from: ${MAIL_FROM}
    from-name: ${MAIL_FROM_NAME}
